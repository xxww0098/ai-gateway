[package]
name = "gw-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false          # rule 2.10: internal crate, no external example readers

[lints]
workspace = true         # rule 4.2: the table is inert without this

[dependencies]
gw-config.workspace = true
gw-model.workspace = true
gw-authcore.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls", "multipart", "charset", "http2"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util"] }
tokio-stream.workspace = true
futures = { workspace = true, features = ["std", "async-await"] }
futures-util = { workspace = true, features = ["std", "async-await"] }
bytes.workspace = true
http.workspace = true
eventsource-stream.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing = { workspace = true, features = ["std"] }
anyhow.workspace = true
uuid = { workspace = true, features = ["v4", "std"] }
base64.workspace = true
sha2 = { workspace = true, features = ["std"] }
hex.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
url.workspace = true
