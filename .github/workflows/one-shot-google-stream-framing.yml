name: One-shot Google stream framing hardening

on:
  push:
    branches: [audit/core-adversarial-hardening]
    paths:
      - tools/one_shot_google_stream_framing.py
      - .github/workflows/one-shot-google-stream-framing.yml

permissions:
  contents: write

concurrency:
  group: one-shot-google-stream-framing
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core-adversarial-hardening
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Apply Google stream framing hardening
        shell: bash
        run: |
          python tools/one_shot_google_stream_framing.py
          python - <<'PY'
          from pathlib import Path

          # The proxy-level regression needs the concrete Bytes type.
          path = Path("crates/gw-proxy/src/routes/tests/stream.rs")
          text = path.read_text(encoding="utf-8")
          old = "use super::*;\n"
          new = "use axum::body::Bytes;\n\nuse super::*;\n"
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError("stream test import anchor not found")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep the 1,000-line ratchet intact: move the new adversarial framing
          # tests into a child module rather than growing the legacy test file.
          parent = Path("crates/gw-relay/src/translate/google/tests.rs")
          source = parent.read_text(encoding="utf-8")
          marker = "/// HTTP transport chunks are unrelated to SSE event boundaries."
          start = source.find(marker)
          if start < 0:
              raise RuntimeError("Google framing test block not found")
          block = source[start:].strip()
          parent.write_text(
              source[:start].rstrip() + "\n\nmod stream_framing;\n",
              encoding="utf-8",
          )
          child = Path("crates/gw-relay/src/translate/google/tests/stream_framing.rs")
          child.parent.mkdir(parents=True, exist_ok=True)
          child.write_text("use super::*;\n\n" + block + "\n", encoding="utf-8")
          PY

      - name: Format changed Rust files
        run: |
          rustfmt --edition 2024 \
            crates/gw-relay/src/translate/google/wire.rs \
            crates/gw-relay/src/translate/google/openai.rs \
            crates/gw-relay/src/translate/google/anthropic.rs \
            crates/gw-relay/src/translate/google/tests.rs \
            crates/gw-relay/src/translate/google/tests/stream_framing.rs \
            crates/gw-proxy/src/routes.rs \
            crates/gw-proxy/src/routes/translation.rs \
            crates/gw-proxy/src/routes/stream.rs \
            crates/gw-proxy/src/routes/tests/stream.rs \
            crates/gw-proxy/src/routes/tests/dispatch.rs

      - name: Test relay and proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test -p gw-relay -p gw-proxy

      - name: Clippy relay and proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo clippy -p gw-relay -p gw-proxy --all-targets -- -D warnings

      - name: Remove one-shot machinery before final-tree checks
        run: |
          rm tools/one_shot_google_stream_framing.py
          rm .github/workflows/one-shot-google-stream-framing.yml

      - name: Architecture gates
        run: cargo xtask ci

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/gw-relay/src/translate/google/wire.rs \
            crates/gw-relay/src/translate/google/openai.rs \
            crates/gw-relay/src/translate/google/anthropic.rs \
            crates/gw-relay/src/translate/google/tests.rs \
            crates/gw-relay/src/translate/google/tests/stream_framing.rs \
            crates/gw-proxy/src/routes.rs \
            crates/gw-proxy/src/routes/translation.rs \
            crates/gw-proxy/src/routes/stream.rs \
            crates/gw-proxy/src/routes/tests/stream.rs \
            crates/gw-proxy/src/routes/tests/dispatch.rs
          git add -u \
            tools/one_shot_google_stream_framing.py \
            .github/workflows/one-shot-google-stream-framing.yml
          git commit -m "fix(relay): make Google SSE translation chunk-safe"
          git push origin HEAD:audit/core-adversarial-hardening
