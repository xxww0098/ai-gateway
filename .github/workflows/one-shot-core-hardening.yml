name: One-shot core hardening

on:
  push:
    branches: [audit/core-adversarial-hardening]
    paths:
      - tools/one_shot_core_hardening.py
      - tools/run_core_hardening.py
      - .github/workflows/one-shot-core-hardening.yml

permissions:
  contents: write

concurrency:
  group: one-shot-core-hardening
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core-adversarial-hardening
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Apply adversarial hardening patch
        run: python tools/run_core_hardening.py

      - name: Format changed Rust files
        run: |
          rustfmt --edition 2024 \
            crates/gw-relay/src/probe/tests.rs \
            crates/gw-relay/src/translate/anthropic.rs \
            crates/gw-relay/src/translate/anthropic/to_anthropic.rs \
            crates/gw-relay/src/translate/anthropic/to_openai.rs \
            crates/gw-relay/src/translate/anthropic/tests.rs \
            crates/gw-provider/src/types.rs \
            crates/gw-provider/src/common.rs \
            crates/gw-provider/src/common_tests.rs \
            crates/gw-provider/src/openai.rs \
            crates/gw-provider/src/codex.rs \
            crates/gw-provider/src/claude.rs \
            crates/gw-provider/src/claude/tests.rs \
            crates/gw-provider/src/gemini.rs \
            crates/gw-provider/src/gemini/tests.rs \
            crates/gw-provider/src/vertex.rs \
            crates/gw-provider/src/vertex/tests.rs \
            crates/gw-proxy/src/routes.rs \
            crates/gw-proxy/src/routes/catalogue.rs \
            crates/gw-proxy/src/routes/routing.rs \
            crates/gw-proxy/src/routes/translation.rs \
            crates/gw-proxy/src/routes/stream.rs \
            crates/gw-proxy/src/routes/tests/dispatch.rs \
            crates/gw-proxy/src/usage.rs \
            crates/gw-proxy/src/usage/tests.rs

      - name: Test relay, provider, and proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test -p gw-relay -p gw-provider -p gw-proxy

      - name: Clippy relay, provider, and proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo clippy -p gw-relay -p gw-provider -p gw-proxy --all-targets -- -D warnings

      - name: Architecture gates
        run: cargo xtask ci

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit verified source changes and remove one-shot machinery
        run: |
          rm tools/one_shot_core_hardening.py
          rm tools/run_core_hardening.py
          rm .github/workflows/one-shot-core-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/gw-relay/src/probe/tests.rs \
            crates/gw-relay/src/translate/anthropic.rs \
            crates/gw-relay/src/translate/anthropic/to_anthropic.rs \
            crates/gw-relay/src/translate/anthropic/to_openai.rs \
            crates/gw-relay/src/translate/anthropic/tests.rs \
            crates/gw-provider/src/types.rs \
            crates/gw-provider/src/common.rs \
            crates/gw-provider/src/common_tests.rs \
            crates/gw-provider/src/openai.rs \
            crates/gw-provider/src/codex.rs \
            crates/gw-provider/src/claude.rs \
            crates/gw-provider/src/claude/tests.rs \
            crates/gw-provider/src/gemini.rs \
            crates/gw-provider/src/gemini/tests.rs \
            crates/gw-provider/src/vertex.rs \
            crates/gw-provider/src/vertex/tests.rs \
            crates/gw-proxy/src/routes.rs \
            crates/gw-proxy/src/routes/catalogue.rs \
            crates/gw-proxy/src/routes/routing.rs \
            crates/gw-proxy/src/routes/translation.rs \
            crates/gw-proxy/src/routes/stream.rs \
            crates/gw-proxy/src/routes/tests/dispatch.rs \
            crates/gw-proxy/src/usage.rs \
            crates/gw-proxy/src/usage/tests.rs
          git add -u \
            tools/one_shot_core_hardening.py \
            tools/run_core_hardening.py \
            .github/workflows/one-shot-core-hardening.yml
          git commit -m "fix(core): wire protocol translation and harden billing"
          git push origin HEAD:audit/core-adversarial-hardening