<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Squircle Border Rim -->
    <linearGradient id="p3-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Upper Monolith Chamfer -->
    <linearGradient id="p3-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Central Backbone Segment -->
    <linearGradient id="p3-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Lower Monolith Chamfer -->
    <linearGradient id="p3-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Transverse High-Speed Refraction Beam (45-degree angle slice) -->
    <linearGradient id="p3-beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Core Ambient Light -->
    <radialGradient id="p3-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="p3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#p3-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#p3-rim)" stroke-width="2" fill="none"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#p3-ambient)"/>

  <!-- ARCHITECTURAL APEX GATEWAY -->
  <g filter="url(#p3-shadow)">
    <!-- 45-degree High-Speed Refractive Optical Beam through Center -->
    <polygon points="120,392 392,120 424,152 152,424" fill="url(#p3-beam)"/>

    <!-- Upper Monolith Portal Arm (Bold Chamfered Ingress) -->
    <path d="M 172 108 L 388 108 L 388 184 L 248 184 L 172 260 Z"
          fill="url(#p3-top)"/>
    <path d="M 172 108 L 388 108 L 388 184 L 248 184 L 172 260 Z"
          fill="#FFFFFF"
          fill-opacity="0.12"/>
    <path d="M 172 108 L 388 108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Lower Monolith Portal Arm (Bold Chamfered Egress) -->
    <path d="M 172 252 L 248 328 L 388 328 L 388 404 L 172 404 Z"
          fill="url(#p3-bot)"/>
    <path d="M 172 252 L 248 328 L 388 328 L 388 404 L 172 404 Z"
          fill="#FFFFFF"
          fill-opacity="0.08"/>
    <path d="M 172 404 L 388 404" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Precision Gateway Center Core Diamond -->
    <rect x="226" y="226" width="60" height="60" rx="14" transform="rotate(45 256 256)"
          fill="#090D16"
          stroke="#22D3EE"
          stroke-width="3"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
  </g>
</svg>
