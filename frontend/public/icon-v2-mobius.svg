<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Squircle Border Rim -->
    <linearGradient id="p2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ribbon 1: Upper / Primary Gateway Loop (Mint -> Emerald -> Teal) -->
    <linearGradient id="p2-loop1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="25%" stop-color="#14B8A6"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Ribbon 2: Lower / Egress Stream Loop (Cyan -> Indigo -> Violet) -->
    <linearGradient id="p2-loop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Intersecting Core Light Beam (White -> Cyan Glow) -->
    <linearGradient id="p2-core-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Bloom -->
    <radialGradient id="p2-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#4F46E5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Natural Depth Shadow -->
    <filter id="p2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#p2-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#p2-rim)" stroke-width="2" fill="none"/>

  <!-- Center Ambient -->
  <circle cx="256" cy="256" r="180" fill="url(#p2-ambient)"/>

  <!-- MOBIUS GATEWAY SHAPES -->
  <g filter="url(#p2-shadow)">
    <!-- Lower / Underweave Arc -->
    <path d="M 230 256 C 260 210, 360 220, 370 290 C 380 360, 310 420, 220 410 C 130 400, 95 320, 110 250 C 120 200, 160 140, 230 110"
          stroke="url(#p2-loop2)"
          stroke-width="52"
          stroke-linecap="round"
          fill="none"/>

    <!-- Upper / Overweave Arc (Forms the signature 'C' Gateway entrance) -->
    <path d="M 370 170 C 350 110, 280 80, 200 95 C 120 110, 80 180, 85 260 C 90 340, 150 400, 230 405 C 290 410, 350 375, 370 325"
          stroke="url(#p2-loop1)"
          stroke-width="52"
          stroke-linecap="round"
          fill="none"/>

    <!-- Precision Inner Light Crest / Highlight -->
    <path d="M 350 160 C 310 110, 250 95, 190 110 C 130 125, 95 180, 100 250"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-opacity="0.6"
          fill="none"/>

    <!-- Central Gateway Vortex Aperture (Negative Space Focus) -->
    <circle cx="256" cy="256" r="28" fill="#0A0E17" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
  </g>
</svg>
