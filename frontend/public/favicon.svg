<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Clean White Background with subtle rounded border -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>

  <!-- Crisp Bold Monoline Outer C Arc -->
  <path d="M 45 19 A 18.5 18.5 0 1 0 45 45"
        stroke="#0F172A"
        stroke-width="5.5"
        stroke-linecap="round"/>

  <!-- Inner Cyan-Teal Arc -->
  <path d="M 39 25 A 10.5 10.5 0 1 0 39 39"
        stroke="#0D9488"
        stroke-width="4.5"
        stroke-linecap="round"/>

  <!-- Center Horizontal Data Line -->
  <path d="M 23 32 L 34 32"
        stroke="#0F172A"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Core Dot -->
  <circle cx="39" cy="32" r="2.8" fill="#0D9488"/>
</svg>