<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>icon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; padding: 40px; }
    .light { background: #f8fafc; color: #0f172a; }
    .dark { background: #0b1220; color: #f8fafc; margin-top: 24px; }
    section { padding: 28px; border-radius: 20px; }
    h1 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .5; margin-bottom: 20px; }
    .row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
    .nav { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; }
    .light .nav { background: #fff; border: 1px solid #e2e8f0; }
    .dark .nav { background: #111827; border: 1px solid #1f2937; }
    b { font-size: 15px; }
    small { display: block; font-size: 12px; opacity: .55; font-weight: 500; }
  </style>
</head>
<body>
  <section class="light">
    <h1>Light</h1>
    <div class="row">
      <img src="./icon.svg" width="160" height="160" style="border-radius:36px" alt="">
      <img src="./icon.svg" width="64" height="64" style="border-radius:16px" alt="">
      <img src="./icon.svg" width="36" height="36" style="border-radius:10px" alt="">
      <img src="./icon.svg" width="24" height="24" style="border-radius:6px" alt="">
      <img src="./favicon.svg" width="16" height="16" style="border-radius:4px" alt="">
      <div class="nav">
        <img src="./icon.svg" width="36" height="36" style="border-radius:10px" alt="">
        <div><b>ai-gateway</b><small>控制台</small></div>
      </div>
    </div>
  </section>
  <section class="dark">
    <h1>Dark</h1>
    <div class="row">
      <img src="./icon.svg" width="160" height="160" style="border-radius:36px" alt="">
      <img src="./icon.svg" width="36" height="36" style="border-radius:10px" alt="">
      <div class="nav">
        <img src="./icon.svg" width="36" height="36" style="border-radius:10px" alt="">
        <div><b>ai-gateway</b><small>控制台</small></div>
      </div>
      <div style="width:72px;height:72px;display:grid;place-items:center;background:#111827;border-radius:16px">
        <img src="./icon-mark.svg" width="48" height="48" alt="">
      </div>
    </div>
  </section>
</body>
</html>
