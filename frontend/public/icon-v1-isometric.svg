<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Outer Squircle Rim -->
    <linearGradient id="p1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#2DD4BF" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Facet 1: Top Ingress Blade (Cyan -> Mint) -->
    <linearGradient id="p1-f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Facet 2: Left Backbone & Apex (Teal -> Emerald) -->
    <linearGradient id="p1-f2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Facet 3: Bottom Egress Stream (Electric Cyan -> Royal Blue) -->
    <linearGradient id="p1-f3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Facet 4: Inner Dimensional Fold (Deep Slate & Vibrant Rim) -->
    <linearGradient id="p1-f4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core Portal Glow -->
    <radialGradient id="p1-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Depth Shadow -->
    <filter id="p1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="p1-inner-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#p1-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#p1-rim)" stroke-width="2" fill="none"/>

  <!-- Ambient Portal Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#p1-core)"/>

  <!-- MAIN ISOMETRIC PORTAL GEOMETRY -->
  <g filter="url(#p1-shadow)">
    <!-- Back Interior Depth Plane -->
    <path d="M 256 156 L 356 214 L 356 298 L 256 356 L 156 298 L 156 214 Z"
          fill="url(#p1-f4)"
          stroke="#1E293B"
          stroke-width="1.5"/>

    <!-- Central Floating Vector Aperture (The Gateway Core) -->
    <path d="M 256 195 L 309 226 L 309 286 L 256 317 L 203 286 L 203 226 Z"
          fill="#090E17"
          stroke="#38BDF8"
          stroke-width="2"
          stroke-opacity="0.7"/>

    <!-- Inner Core Refraction Spark -->
    <polygon points="256,220 286,256 256,292 226,256" fill="url(#p1-f1)" opacity="0.9"/>
    <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>

    <!-- Interlocking Dimensional Segment 1: Upper Gateway Ingress (Top & Right-Up) -->
    <path d="M 256 76 L 412 166 L 342 206 L 256 156 L 170 206 L 100 166 Z"
          fill="url(#p1-f1)"
          filter="url(#p1-inner-glow)"/>
    <path d="M 256 76 L 412 166 L 342 206 L 256 156 Z"
          fill="#FFFFFF"
          fill-opacity="0.12"/>

    <!-- Interlocking Dimensional Segment 2: Left Backbone Pillar (Routing Spine) -->
    <path d="M 100 166 L 170 206 L 170 306 L 100 346 Z"
          fill="url(#p1-f2)"/>
    <path d="M 100 166 L 170 206 L 170 306 Z"
          fill="#FFFFFF"
          fill-opacity="0.08"/>

    <!-- Interlocking Dimensional Segment 3: Bottom Gateway Egress (Bottom & Right-Down) -->
    <path d="M 100 346 L 170 306 L 256 356 L 342 306 L 412 346 L 256 436 Z"
          fill="url(#p1-f3)"/>
    <path d="M 256 356 L 342 306 L 412 346 L 256 436 Z"
          fill="#FFFFFF"
          fill-opacity="0.1"/>

    <!-- Edge Specular Precision Highlights -->
    <path d="M 256 76 L 412 166" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 100 166 L 256 76" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M 100 346 L 256 436 L 412 346" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
  </g>
</svg>
