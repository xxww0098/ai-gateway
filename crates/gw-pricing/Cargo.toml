[package]
name = "gw-pricing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false          # rule 2.10: internal crate, no external example readers

[lints]
workspace = true         # rule 4.2: the table is inert without this

[dependencies]
gw-model.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "macros"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tracing = { workspace = true, features = ["std"] }
arc-swap.workspace = true

# Rule 2.5: test-only — src/testsupport.rs (cfg(test)) stamps rows with chrono.
[dev-dependencies]
chrono = { workspace = true, features = ["clock", "std", "serde"] }
