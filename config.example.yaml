server:
  host: 127.0.0.1
  port: 8888

database:
  host: 127.0.0.1
  port: 5432
  user: ai_gateway
  password: ""
  dbname: ai_gateway
  sslmode: disable
  # Connection pool tuning (optional). Omit/0 → gateway defaults (25/50/30m),
  # sized for a hot proxy path. Also settable via DB_MAX_IDLE_CONNS /
  # DB_MAX_OPEN_CONNS / DB_CONN_MAX_LIFETIME_MINUTES.
  max_idle_conns: 0
  max_open_conns: 0
  conn_max_lifetime_minutes: 0

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

auth:
  jwt:
    secret: ""
    expiry_hours: 24
  # 32-byte key (hex/base64) enabling AES-GCM encryption-at-rest of upstream
  # provider credentials (auth_records.metadata). Empty = cleartext (not
  # recommended for production). Prefer the CREDENTIAL_ENCRYPTION_KEY env var.
  credential_encryption_key: ""
  # First-run owner bootstrap: on a fresh deploy with no super_admin yet, the
  # user with this exact email is promoted to super_admin (at startup if already
  # registered, otherwise the moment they register). Set BOOTSTRAP_ADMIN_PASSWORD
  # to create the account immediately. Inert once any super_admin exists.
  # Prefer the BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD env vars.
  bootstrap_admin_email: ""
  bootstrap_admin_password: ""

sdk:
  base_url: https://sdk.example.com
  api_key: ""
  timeout_seconds: 30
  openai:
    enabled: true
    base_url: ""
    api_key: ""
  openai_compatible:
    enabled: false
    base_url: ""
    api_key: ""
  claude:
    enabled: false
    base_url: ""
    api_key: ""
  gemini:
    enabled: false
    base_url: ""
    api_key: ""
  codex:
    enabled: false
    base_url: ""
    api_key: ""
  vertex:
    enabled: false
    base_url: ""
    api_key: ""
  # xAI (Grok) and Kiro OAuth are panel-driven (device-code / Builder ID).
  # There is no sdk.xai / sdk.kiro block: connect an account from
  # AI-GateWay → 渠道 → OAuth. xAI tokens are used by the OpenAI-compatible
  # executor (channel prefix `xai/` or `grok/`). Kiro tokens are stored and
  # refreshed; the 15-cell relay matrix has no Kiro cell, so export the
  # auth file or call the kiro executor directly.

frontend:
  port: 3030

billing:
  default_price_per_1k_tokens: 0.001
  hold_ttl_seconds: 3600
  # strict_usage_metadata_mode controls how billing settles a successful
  # upstream response when the provider's usage metadata envelope is missing
  # (e.g. OpenAI streaming response without a terminal `usage` event).
  #   false (default): conservative fallback — settle at least the
  #     Active_Hold_Amount so tenants cannot obtain free upstream output.
  #   true: strict mode — do NOT settle or release; leave the Hold in place
  #     until it expires via TTL (or out-of-band reconciliation), and write
  #     a UsageLog row with Failed=true for operator follow-up.
  strict_usage_metadata_mode: false

# 服务面 /api/service —— ozon-pod 集成用的内网接口（建号 / 发 key / 余额 / 用量 /
# 入账）。契约见 docs/service-api.md。token 为空 = 整组路由不挂载（404）；
# 生产按部署密钥对待，走 SERVICE_TOKEN 注入，不要写进版本库。
service:
  token: ""
  # 供给账号的初始额度；契约要求 0（不赠注册额度）。
  initial_credit: 0
  # 余额 / 金额的币种标签，只作展示与透传。
  currency: USD
  # 单次入账上限。
  max_credit: 100000
