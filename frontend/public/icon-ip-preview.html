<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>IP preview</title>
  <style>
    body { margin: 0; background: #EDE6DA; padding: 28px 32px; font-family: ui-sans-serif, system-ui, sans-serif; }
    .row { display: flex; gap: 18px; justify-content: center; margin-bottom: 18px; }
    figure { margin: 0; text-align: center; }
    img { width: 168px; height: 168px; border-radius: 38px; box-shadow: 0 8px 20px rgba(40,28,16,.12); background: #ddd; }
    figcaption { margin-top: 8px; font-size: 13px; color: #3A342C; font-weight: 600; }
  </style>
</head>
<body>
  <div class="row">
    <figure><img src="icon-ip-1.svg" alt="1"/><figcaption>01 守门狐</figcaption></figure>
    <figure><img src="icon-ip-2.svg" alt="2"/><figcaption>02 拱门灵</figcaption></figure>
    <figure><img src="icon-ip-3.svg" alt="3"/><figcaption>03 钥匙猫</figcaption></figure>
    <figure><img src="icon-ip-4.svg" alt="4"/><figcaption>04 哨兵鸮</figcaption></figure>
    <figure><img src="icon-ip-5.svg" alt="5"/><figcaption>05 流式海豚</figcaption></figure>
  </div>
  <div class="row">
    <figure><img src="icon-ip-6.svg" alt="6"/><figcaption>06 账本丸</figcaption></figure>
    <figure><img src="icon-ip-7.svg" alt="7"/><figcaption>07 门童机</figcaption></figure>
    <figure><img src="icon-ip-8.svg" alt="8"/><figcaption>08 云端灵</figcaption></figure>
    <figure><img src="icon-ip-9.svg" alt="9"/><figcaption>09 密钥熊</figcaption></figure>
    <figure><img src="icon-ip-10.svg" alt="10"/><figcaption>10 闸口蜗牛</figcaption></figure>
  </div>
</body>
</html>
