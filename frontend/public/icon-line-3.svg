<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Clean White Background -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#E2E8F0" stroke-width="3" fill="none"/>

  <!-- Three Parallel Clean Geometric Gateway Tracks (Multi-Channel Routing Stream) -->
  <!-- Outer Conduit (OpenAI / Upstream Primary) -->
  <path d="M 362 150 A 150 150 0 1 0 362 362"
        stroke="#0F172A"
        stroke-width="22"
        stroke-linecap="round"/>

  <!-- Middle Conduit (Claude / Failover Routing) -->
  <path d="M 332 180 A 108 108 0 1 0 332 332"
        stroke="#0D9488"
        stroke-width="20"
        stroke-linecap="round"/>

  <!-- Inner Conduit (DeepSeek / Fast Token Stream) -->
  <path d="M 302 210 A 66 66 0 1 0 302 302"
        stroke="#14B8A6"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- Precision Ingress Entry Pins -->
  <circle cx="362" cy="150" r="11" fill="#0F172A"/>
  <circle cx="332" cy="180" r="10" fill="#0D9488"/>
  <circle cx="302" cy="210" r="9" fill="#14B8A6"/>
</svg>
